---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: siva-argocd-application-set
  namespace: openshift-gitops
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
      - git:
          repoURL: https://github.com/snakka112/argocd-practice-app-structure.git
          revision: HEAD
          directories:
            - path: sit/base/*
  template:
    metadata:
      name: '{{.path.basename}}-sit'
    spec:
      project: default
      source:
        repoURL: https://github.com/snakka112/argocd-practice-app-structure.git
        targetRevision: HEAD
        path: '{{.path.path}}'
      destination:
        name: https://kubernetes.default.svc
        namespace: '{{.path.basename}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
---